<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Exec Preview</title>
  <link rel="stylesheet" href="../styles.css">
  <style>
    body { padding: 16px; }
    h1 { font-size: 1.1rem; margin: 0 0 4px; }
    .row { display: grid; grid-template-columns: 140px repeat(7, 1fr); gap: 8px; align-items: center; margin-bottom: 8px; }
    .row .cell { background: var(--card); border: 1px solid var(--border); border-radius: 6px; overflow: hidden; }
    .head { font-size: 0.8rem; color: var(--muted); text-align: center; }
    .name { font-size: 0.85rem; }
    .large .row { grid-template-columns: repeat(4, 1fr); }
    .large .row .name, .large .row:first-child { display: none; }
  </style>
</head>
<body>
  <!-- Developer page: every exec in every pose, for checking the drawing. Not linked from the app. -->
  <h1>Exec drawing preview</h1>
  <p class="muted small">Animations run as they would in a call. Talking uses the simple mouth loop.</p>
  <div id="grid"></div>
  <script type="module">
    import { mountExec } from "../js/exec-drawing.js";
    import { COPY } from "../js/copy.js";

    const poses = [
      ["Ringing", { base: "ringing", mood: "neutral", skeptical: false, talking: false }],
      ["Engaged", { base: "on-call", mood: "engaged", skeptical: false, talking: false }],
      ["Neutral", { base: "on-call", mood: "neutral", skeptical: false, talking: false }],
      ["Impatient", { base: "on-call", mood: "impatient", skeptical: false, talking: false }],
      ["Skeptical, talking", { base: "on-call", mood: "neutral", skeptical: true, talking: true }],
      ["Hung up", { base: "hung-up", mood: "impatient", skeptical: false, talking: false }],
      ["Meeting booked", { base: "booked", mood: "engaged", skeptical: false, talking: false }],
    ];
    const personas = await fetch("../data/personas.json").then((r) => r.json());
    const grid = document.getElementById("grid");
    const header = document.createElement("div");
    header.className = "row";
    header.append(document.createElement("div"), ...poses.map(([label]) => Object.assign(document.createElement("div"), { className: "head", textContent: label })));
    grid.append(header);
    // ?only=<persona id> shows one exec, large.
    const only = new URLSearchParams(location.search).get("only");
    if (only) document.body.classList.add("large");
    for (const persona of personas.filter((p) => !only || p.id === only)) {
      const row = document.createElement("div");
      row.className = "row";
      row.append(Object.assign(document.createElement("div"), { className: "name", textContent: persona.name }));
      for (const [, pose] of poses) {
        const cell = document.createElement("div");
        cell.className = "cell";
        row.append(cell);
        mountExec(cell, persona, COPY.exec.describe).setPose(pose);
      }
      grid.append(row);
    }
  </script>
</body>
</html>
