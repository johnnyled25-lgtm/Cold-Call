<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Cold Call Lab</title>
  <!-- Tab icon: the header's phone logo, inline (colors written in: favicons can't use CSS variables) -->
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='%23A3523A'/%3E%3Cpath fill='%23FFFDF9' d='M10.5 9.5c1-1 2.4-.9 3 .3l1.2 2.3c.4.8.2 1.7-.5 2.2l-.9.7c.8 1.7 2.1 3 3.8 3.8l.7-.9c.5-.7 1.4-.9 2.2-.5l2.3 1.2c1.2.6 1.3 2 .3 3l-1 1c-1.2 1.2-3 1.5-4.5.8-3.4-1.6-6.1-4.3-7.7-7.7-.7-1.5-.4-3.3.8-4.5z'/%3E%3Ccircle cx='23' cy='9' r='2.2' fill='%23D9A441'/%3E%3C/svg%3E">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="app-header">
    <h1 class="app-name">
      <a href="#home" class="home-link" data-route="home">
      <svg class="app-logo" viewBox="0 0 32 32" aria-hidden="true">
        <circle class="logo-disc" cx="16" cy="16" r="15"/>
        <path class="logo-phone" d="M10.5 9.5c1-1 2.4-.9 3 .3l1.2 2.3c.4.8.2 1.7-.5 2.2l-.9.7c.8 1.7 2.1 3 3.8 3.8l.7-.9c.5-.7 1.4-.9 2.2-.5l2.3 1.2c1.2.6 1.3 2 .3 3l-1 1c-1.2 1.2-3 1.5-4.5.8-3.4-1.6-6.1-4.3-7.7-7.7-.7-1.5-.4-3.3.8-4.5z"/>
        <circle class="logo-dot" cx="23" cy="9" r="2.2"/>
      </svg>
      <span data-copy="appName"></span>
      </a>
    </h1>
    <nav class="app-nav" aria-label="App">
      <a href="#home" class="nav-tab" data-route="home" data-tab="home" data-copy="nav.home"></a>
      <a href="#briefing" class="nav-tab" data-route="briefing" data-tab="briefing" data-copy="nav.briefing"></a>
      <a href="#b2c" class="nav-tab" data-route="b2c" data-tab="b2c" data-copy="nav.b2c"></a>
      <a href="#past" class="nav-tab" data-route="past" data-tab="past" id="open-past" data-copy="pastCalls.navLink"></a>
      <button type="button" class="nav-tab nav-settings" id="open-settings" data-copy="settings.heading"></button>
    </nav>
  </header>

  <main>
    <div id="app-message" class="notice notice-error app-message" role="alert" hidden></div>

    <!-- Home: the introduction page -->
    <section id="screen-home" class="screen" aria-labelledby="home-heading" hidden>
      <div class="home-hero">
        <div class="home-faces" id="home-faces" aria-hidden="true"></div>
        <h2 id="home-heading" tabindex="-1" data-copy="home.title"></h2>
        <p class="home-tagline" data-copy="home.tagline"></p>
        <div class="home-actions">
          <button type="button" class="btn btn-primary btn-big" id="btn-home-start">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1z"/></svg>
            <span data-copy="home.start"></span>
          </button>
          <button type="button" class="btn btn-icon" id="btn-home-past" hidden><span data-copy="home.seePast"></span></button>
        </div>
      </div>

      <h3 class="home-subhead" data-copy="home.howHeading"></h3>
      <ol class="home-steps" id="home-steps"></ol>

      <h3 class="home-subhead" data-copy="home.readyHeading"></h3>
      <ul class="home-checks" id="home-checks"></ul>
    </section>

    <!-- Screen 1: the briefing the student reads before calling -->
    <section id="screen-briefing" class="screen" aria-labelledby="briefing-heading">
      <h2 id="briefing-heading" tabindex="-1" data-copy="briefing.heading"></h2>
      <details class="explainer">
        <summary data-copy="explainers.toggle"></summary>
        <h3 class="explainer-label" data-copy="explainers.whatLabel"></h3>
        <p data-copy="explainers.briefing.what"></p>
        <h3 class="explainer-label" data-copy="explainers.whyLabel"></h3>
        <p data-copy="explainers.briefing.why"></p>
      </details>
      <div class="dossier" id="briefing-card"></div>
      <div class="briefing-actions" id="briefing-actions">
        <button type="button" class="btn btn-primary btn-big" id="btn-call">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2c.3-.3.7-.4 1-.2 1.1.4 2.3.6 3.6.6.6 0 1 .4 1 1V20c0 .6-.4 1-1 1A17 17 0 0 1 3 4c0-.6.4-1 1-1h3.5c.6 0 1 .4 1 1 0 1.2.2 2.4.6 3.6.1.3 0 .7-.2 1z"/></svg>
          <span id="btn-call-label" data-copy="briefing.callButton"></span>
        </button>
        <button type="button" class="btn btn-icon" id="btn-random">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 3h5v5M4 20 21 3M21 16v5h-5M15 15l6 6M4 4l5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <span data-copy="briefing.randomButton"></span>
        </button>
      </div>
    </section>

    <!-- Screen 2: the call -->
    <section id="screen-call" class="screen" aria-labelledby="call-heading" hidden>
      <h2 id="call-heading" class="visually-hidden" data-copy="call.heading"></h2>
      <!-- While ringing: "Calling…" -->
      <div class="calling" id="calling">
        <div class="pulse"><div class="avatar" id="calling-avatar"></div></div>
        <div class="calling-status" data-copy="call.calling"></div>
        <h3 id="calling-name"></h3>
        <div class="calling-sub" id="calling-sub"></div>
        <span class="goal-chip">
          <svg viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6.5" fill="none" stroke="currentColor" stroke-width="1.6"/><circle cx="8" cy="8" r="2.5" fill="currentColor"/></svg>
          <span data-copy="call.goalChip"></span>
        </span>
        <div class="calling-actions">
          <button type="button" class="round-btn end" id="btn-calling-end" data-copy-label="call.hangUp">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 14.2c5.5-5.3 14.5-5.3 20 0l-2.6 2.7c-.5.5-1.4.6-2 .1l-2.3-1.6c-.5-.4-.7-1-.6-1.6l.4-1.6c-2.6-.8-5.3-.8-7.9 0l.4 1.6c.1.6-.1 1.2-.6 1.6L4.6 17c-.6.5-1.5.4-2-.1z"/></svg>
          </button>
          <span class="btn-label" data-copy="call.hangUp"></span>
        </div>
      </div>

      <!-- After pickup: the exec and the phone on the left, your briefing on the right -->
      <div class="call-layout" id="call-live" hidden>
        <div class="call-left">
          <div class="exec-stage" id="exec-stage"></div>
          <div class="phone-panel">
            <div class="phone-header">
              <div class="avatar" id="phone-avatar"></div>
              <div class="phone-who">
                <div class="phone-name" id="phone-name"></div>
                <div class="phone-sub" id="phone-sub"></div>
              </div>
              <span class="phone-timer" id="phone-timer">0:00</span>
            </div>
            <div class="chat" id="chat">
              <ol class="transcript" id="transcript" aria-live="polite"></ol>
              <div class="typing" id="typing" hidden><i></i><i></i><i></i></div>
            </div>
            <div class="call-status" id="call-status" aria-live="polite"></div>
            <form class="dock" id="typed-form">
              <button type="button" class="round-btn mic small" id="btn-talk" data-copy-label="call.talkButton" hidden>
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="9" y="3" width="6" height="11" rx="3" fill="currentColor"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M9 21h6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
              </button>
              <div class="pill-input">
                <label for="typed-input" class="visually-hidden" data-copy="call.typePlaceholder"></label>
                <input type="text" id="typed-input" autocomplete="off">
                <button type="submit" class="send" id="btn-send" data-copy-label="call.send">
                  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l15-7-5 15-3-6z" fill="currentColor"/></svg>
                </button>
              </div>
              <button type="button" class="round-btn end small" id="btn-end" data-copy-label="call.endCall">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M2 14.2c5.5-5.3 14.5-5.3 20 0l-2.6 2.7c-.5.5-1.4.6-2 .1l-2.3-1.6c-.5-.4-.7-1-.6-1.6l.4-1.6c-2.6-.8-5.3-.8-7.9 0l.4 1.6c.1.6-.1 1.2-.6 1.6L4.6 17c-.6.5-1.5.4-2-.1z"/></svg>
              </button>
            </form>
          </div>
        </div>
        <section class="call-brief" id="call-brief" aria-labelledby="call-brief-heading">
          <h3 id="call-brief-heading">
            <svg viewBox="0 0 16 16" aria-hidden="true"><rect x="2.5" y="1.5" width="11" height="13" rx="2" fill="none" stroke="currentColor" stroke-width="1.5"/><path d="M5 5.5h6M5 8h6M5 10.5h4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
            <span data-copy="call.briefingToggle"></span>
          </h3>
          <div id="call-brief-body" class="brief-tiles"></div>
        </section>
      </div>
      <div id="call-note" class="notice notice-info call-note" role="status" hidden></div>
      <details class="explainer explainer-below">
        <summary data-copy="explainers.toggle"></summary>
        <h3 class="explainer-label" data-copy="explainers.whatLabel"></h3>
        <p data-copy="explainers.call.what"></p>
        <h3 class="explainer-label" data-copy="explainers.whyLabel"></h3>
        <p data-copy="explainers.call.why"></p>
      </details>
    </section>

    <!-- Screen 3: the debrief — the hidden state, revealed -->
    <section id="screen-debrief" class="screen" aria-labelledby="debrief-heading" hidden>
      <button type="button" class="link-button back-link" id="btn-debrief-back" hidden data-copy="nav.backToPast"></button>
      <h2 id="debrief-heading" tabindex="-1" data-copy="debrief.heading"></h2>
      <details class="explainer">
        <summary data-copy="explainers.toggle"></summary>
        <h3 class="explainer-label" data-copy="explainers.whatLabel"></h3>
        <p data-copy="explainers.debrief.what"></p>
        <h3 class="explainer-label" data-copy="explainers.whyLabel"></h3>
        <p data-copy="explainers.debrief.why"></p>
      </details>
      <div id="debrief-body"></div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-call-again" data-copy="debrief.callAgain"></button>
        <button type="button" class="btn" id="btn-new-exec" data-copy="debrief.newExec"></button>
        <button type="button" class="btn" id="btn-debrief-past" data-copy="pastCalls.navLink"></button>
      </div>
    </section>

    <!-- Screen 4: past calls and the Record -->
    <section id="screen-past" class="screen" aria-labelledby="past-heading" hidden>
      <h2 id="past-heading" tabindex="-1" data-copy="pastCalls.heading"></h2>
      <div class="mode-toggle" role="group" aria-label="" data-copy-label="pastCalls.modeGroup">
        <button type="button" class="mode-toggle-btn" data-past-mode="b2b" data-copy="nav.briefing" aria-pressed="true"></button>
        <button type="button" class="mode-toggle-btn" data-past-mode="b2c" data-copy="nav.b2c" aria-pressed="false"></button>
      </div>
      <div id="past-body"></div>
      <div class="actions">
        <button type="button" class="btn btn-primary" id="btn-past-back" data-copy="pastCalls.back"></button>
      </div>
    </section>

    <!-- Exec gallery, shown only with ?gallery=1 in the address -->
    <section id="screen-gallery" class="screen" hidden></section>

    <!-- Developer panel, shown only with ?debug=1 in the address -->
    <section id="debug-panel" class="debug-panel" hidden></section>
  </main>

  <!-- One-time note about browser speech recognition (brief lesson e) -->
  <dialog id="privacy-dialog" class="small-dialog" aria-labelledby="privacy-heading" aria-describedby="privacy-body">
    <form method="dialog">
      <div class="dialog-icon dialog-icon-teal" data-icon="mic"></div>
      <h2 id="privacy-heading" data-copy="voice.privacyTitle"></h2>
      <p id="privacy-body" data-copy="voice.privacyBody"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-primary" value="ok" data-copy="voice.privacyOk"></button>
      </div>
    </form>
  </dialog>

  <!-- How to use the talk button: shown every time a voice call starts, until dismissed for good -->
  <dialog id="mic-tutorial-dialog" class="small-dialog" aria-labelledby="mic-tut-heading">
    <form method="dialog">
      <div class="dialog-icon dialog-icon-teal" data-icon="mic"></div>
      <h2 id="mic-tut-heading" data-copy="voice.tutorialTitle"></h2>
      <ol class="mic-tutorial-steps">
        <li class="mic-tutorial-step" id="mic-tut-step-1">
          <span class="mic-tutorial-btn" aria-hidden="true" data-icon="mic"></span>
          <span data-copy="voice.tutorialStep1"></span>
        </li>
        <li class="mic-tutorial-step" id="mic-tut-step-2">
          <span class="mic-tutorial-btn is-recording" aria-hidden="true">
            <span class="mic-tutorial-bars"><i></i><i></i><i></i></span>
          </span>
          <span data-copy="voice.tutorialStep2"></span>
        </li>
        <li class="mic-tutorial-step" id="mic-tut-step-3">
          <span class="mic-tutorial-btn" aria-hidden="true" data-icon="mic"></span>
          <span data-copy="voice.tutorialStep3"></span>
        </li>
      </ol>
      <label class="mic-tutorial-dismiss">
        <input type="checkbox" id="mic-tut-dismiss">
        <span data-copy="voice.tutorialDontShow"></span>
      </label>
      <div class="dialog-actions">
        <button type="submit" class="btn btn-primary" value="ok" data-copy="voice.tutorialOk"></button>
      </div>
    </form>
  </dialog>

  <!-- A styled yes/no question (instead of the browser's own confirm box) -->
  <dialog id="confirm-dialog" class="small-dialog" aria-labelledby="confirm-title" aria-describedby="confirm-body">
    <form method="dialog">
      <div class="dialog-icon" id="confirm-icon"></div>
      <h2 id="confirm-title"></h2>
      <p id="confirm-body"></p>
      <div class="dialog-actions">
        <button type="submit" class="btn" value="cancel" id="confirm-cancel" autofocus></button>
        <button type="submit" class="btn btn-danger-solid" value="ok" id="confirm-ok"></button>
      </div>
    </form>
  </dialog>

  <!-- Settings drawer -->
  <dialog id="settings-drawer" class="drawer" aria-labelledby="settings-heading">
    <form id="settings-form" method="dialog">
      <div class="drawer-head">
        <h2 id="settings-heading" data-copy="settings.heading"></h2>
        <button type="button" class="link-button" id="btn-close-settings" data-copy="settings.close"></button>
      </div>
      <div id="settings-alert" class="notice notice-warn" role="alert" hidden></div>

      <section class="set-section" aria-labelledby="set-provider-head">
        <h3 class="set-head" id="set-provider-head"><span class="set-num" aria-hidden="true">1</span><span data-copy="settings.sectionProvider"></span></h3>
        <div class="provider-cards" role="radiogroup" aria-labelledby="set-provider-head">
          <label class="provider-card">
            <input type="radio" name="provider" value="anthropic">
            <span class="pc-name" data-copy="settings.providerNames.anthropic"></span>
            <span class="pc-sub" id="pc-sub-anthropic"></span>
          </label>
          <label class="provider-card">
            <input type="radio" name="provider" value="openai">
            <span class="pc-name" data-copy="settings.providerNames.openai"></span>
            <span class="pc-sub" id="pc-sub-openai"></span>
          </label>
        </div>
      </section>

      <section class="set-section" aria-labelledby="set-key-head">
        <h3 class="set-head" id="set-key-head">
          <span class="set-num" aria-hidden="true">2</span><span data-copy="settings.sectionKey"></span>
          <span class="key-badge" id="key-badge" hidden></span>
        </h3>
        <div class="info-card">
          <div class="info-card-icon" data-icon="key"></div>
          <div>
            <p data-copy="settings.keyWhat"></p>
            <p data-copy="settings.keyNotSubscription"></p>
            <p><span data-copy="settings.keyWhere"></span> <a id="key-link" target="_blank" rel="noopener noreferrer"></a></p>
            <p class="muted" data-copy="settings.keyPrivacy"></p>
          </div>
        </div>
        <label for="set-key" class="field-label" data-copy="settings.apiKey"></label>
        <div class="key-row">
          <input type="password" id="set-key" autocomplete="off" spellcheck="false">
          <button type="button" class="btn" id="btn-show-key" aria-controls="set-key" data-copy="settings.showKey"></button>
        </div>
        <div class="test-row">
          <button type="button" class="btn" id="btn-test" data-copy="settings.test"></button>
          <div id="test-result" class="test-result" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="set-section" aria-labelledby="set-model-head">
        <h3 class="set-head" id="set-model-head"><span class="set-num" aria-hidden="true">3</span><span data-copy="settings.sectionModel"></span></h3>
        <label for="set-model" class="field-label" data-copy="settings.model"></label>
        <input type="text" id="set-model" autocomplete="off" spellcheck="false">
        <p class="muted small" data-copy="settings.modelNote"></p>
        <button type="button" class="link-button small" id="btn-model-reset"></button>
        <div id="temp-field">
          <label for="set-temp" class="field-label"><span data-copy="settings.temperature"></span>: <output id="temp-value" for="set-temp"></output></label>
          <input type="range" id="set-temp" min="0" max="1" step="0.1" aria-describedby="temp-note">
          <p class="muted small" id="temp-note"></p>
        </div>
      </section>

      <section class="set-section" aria-labelledby="set-voice-head">
        <h3 class="set-head" id="set-voice-head"><span class="set-num set-num-plain" aria-hidden="true" data-icon="mic"></span><span data-copy="settings.sectionVoice"></span></h3>
        <div class="test-row">
          <button type="button" class="btn" id="btn-mic-test" data-copy="voice.test"></button>
          <div id="mic-test-result" class="test-result" role="status" aria-live="polite"></div>
        </div>
      </section>

      <section class="set-section danger-zone" aria-labelledby="set-clear-head">
        <h3 class="set-head" id="set-clear-head" data-copy="settings.clearEverything"></h3>
        <p class="muted small" data-copy="settings.clearNote"></p>
        <button type="button" class="btn btn-danger" id="btn-clear" data-copy="settings.clearEverything"></button>
      </section>

      <div class="drawer-footer">
        <button type="submit" class="btn btn-primary" value="save" data-copy="settings.save"></button>
        <button type="submit" class="btn" value="cancel" data-copy="settings.cancel"></button>
      </div>
    </form>
  </dialog>

  <script type="module" src="js/app.js"></script>
</body>
</html>
